# 로컬 확인용: 앱 이미지 + MySQL 8.4.
# 앱 환경변수는 GitOps ConfigMap(apps/taxi/base/configmap.yaml)과 같은 값을 쓴다.
# 실행 전 DB_PASSWORD 환경변수를 설정한다. 비밀번호를 이 파일에 적지 않는다(저장소 public).
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: taxi
      MYSQL_USER: taxi
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 환경변수를 설정하세요}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    ports:
      - "3307:3306"   # 로컬 MySQL(3306)과 겹치지 않게
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u taxi -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    image: ghcr.io/mobility-devops/taxi-backend:local
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/taxi?serverTimezone=UTC&characterEncoding=UTF-8
      DB_USERNAME: taxi
      DB_PASSWORD: ${DB_PASSWORD}
      SERVER_SHUTDOWN: graceful
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,prometheus
      MANAGEMENT_METRICS_DISTRIBUTION_PERCENTILESHISTOGRAM_HTTP_SERVER_REQUESTS: "true"
    stop_grace_period: 30s