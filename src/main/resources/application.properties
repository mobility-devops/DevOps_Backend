spring.application.name=taxi

# MySQL (비밀번호는 환경변수 DB_PASSWORD로 주입)
spring.datasource.url=jdbc:mysql://localhost:3306/taxi?serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:taxi}
spring.datasource.password=${DB_PASSWORD}

# JPA (테이블은 Flyway로만 생성)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=8080

# Swagger (springdoc)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=unsorted
springdoc.default-produces-media-type=application/json
